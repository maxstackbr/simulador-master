name: Sincronizar ranking (Letzplay)

on:
  schedule:
    # A cada 2 horas (cron em UTC; em Brasília cai nas horas ímpares: 1h, 3h, ..., 23h)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Só testar push + e-mail + Telegram com a leitura atual (não grava nem commita nada)'
        type: boolean
        default: false

concurrency: sync-ranking

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Ler o Letzplay
        id: sync
        run: node scripts/sync-letzplay.mjs ${{ inputs.test_notify && '--test-notify' || '' }}
        continue-on-error: true
      - name: Publicar nova versão
        id: publish
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add public/data
          git commit -m "data: classificação do Letzplay em $(date -u +'%Y-%m-%d %H:%M UTC')"
          # A main pode ter andado desde o checkout (plano B, revert): rebase antes do push, com novas tentativas.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push rejeitado (tentativa $i); nova tentativa em 15s"
            sleep 15
          done
          exit 1
      # raw.githubusercontent.com guarda cada arquivo por até 5 min (max-age=300) e ignora no-cache e
      # query string. Qualquer cópia em cache foi guardada antes do push, logo expira em até 300 s depois
      # dele. Esperar antes de avisar garante que quem clicar no link já veja a versão nova.
      - name: Aguardar o cache do CDN expirar
        if: steps.publish.outcome == 'success'
        run: |
          sleep 310
          esperado=$(node -p "require('./public/data/ranking.json').id")
          servido=$(curl -sS --max-time 20 https://raw.githubusercontent.com/${{ github.repository }}/main/public/data/ranking.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id" 2>/dev/null || echo '?')
          echo "versão publicada: $esperado · servida pelo CDN: $servido"
          [ "$servido" = "$esperado" ] || echo "::warning::o CDN ainda serve $servido; o cache expira em até 5 min a partir do push"
      # Notificações só quando algo mudou (e foi publicado) ou a leitura falhou; sem mudança, silêncio.
      # Push, e-mail e Telegram seguem a mesma regra e são independentes: a falha de um não cancela os outros.
      # Se a publicação falhou, ninguém é avisado de "atualizado": o próximo ciclo refaz a leitura e publica.
      - name: Enviar push (ntfy) com o resumo
        if: ${{ !cancelled() && steps.sync.outputs.status != 'unchanged' && steps.publish.outcome != 'failure' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/send-push.mjs
      - name: Enviar e-mail com o resumo
        if: ${{ !cancelled() && steps.sync.outputs.status != 'unchanged' && steps.publish.outcome != 'failure' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
        run: node scripts/send-email.mjs
      - name: Enviar Telegram com o resumo
        if: ${{ !cancelled() && steps.sync.outputs.status != 'unchanged' && steps.publish.outcome != 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/send-telegram.mjs
      - name: Falhar o job se a leitura falhou
        if: steps.sync.outcome == 'failure'
        run: exit 1
