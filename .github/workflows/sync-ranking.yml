name: Sincronizar ranking (Letzplay)

on:
  schedule:
    # A cada 2 horas (cron em UTC; em Brasília cai nas horas ímpares e 23 min: 1h23, 3h23, ..., 23h23).
    # Fora do minuto 0 de propósito: no início de cada hora o GitHub atrasa ou descarta agendamentos
    # (de 19 a 29/10 o cron '0 */2' rendeu 4,7 execuções por dia em vez de 12).
    # Execução presa na fila é cancelada e avisada pelo vigia (watchdog.yml).
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Só testar e-mail + Telegram com a leitura atual (não grava nem commita nada)'
        type: boolean
        default: false

concurrency: sync-ranking

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Última rede de segurança: job morto por timeout não avisa ninguém, por isso os passos que podem
    # travar têm timeout próprio com continue-on-error (viram falha de leitura, que notifica).
    # Normal: até ~12 min de instalação em dia de apt lento + 5 min de espera do CDN.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 20
        continue-on-error: true
      - name: Ler o Letzplay
        id: sync
        run: node scripts/sync-letzplay.mjs ${{ inputs.test_notify && '--test-notify' || '' }}
        # pior caso normal: 2 páginas × 3 tentativas de até 60 s + esperas de 30 s, ~8 min
        timeout-minutes: 15
        continue-on-error: true
      - name: Publicar nova versão
        id: publish
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add public/data
          git commit -m "data: classificação do Letzplay em $(date -u +'%Y-%m-%d %H:%M UTC')"
          # A main pode ter andado desde o checkout (plano B, revert): rebase antes do push, com novas tentativas.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push rejeitado (tentativa $i); nova tentativa em 15s"
            sleep 15
          done
          exit 1
      # raw.githubusercontent.com guarda cada arquivo por até 5 min (max-age=300) e ignora no-cache e
      # query string. Qualquer cópia em cache foi guardada antes do push, logo expira em até 300 s depois
      # dele. Esperar antes de avisar garante que quem clicar no link já veja a versão nova.
      - name: Aguardar o cache do CDN expirar
        if: steps.publish.outcome == 'success'
        run: |
          sleep 310
          esperado=$(node -p "require('./public/data/ranking.json').id")
          servido=$(curl -sS --max-time 20 https://raw.githubusercontent.com/${{ github.repository }}/main/public/data/ranking.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id" 2>/dev/null || echo '?')
          echo "versão publicada: $esperado · servida pelo CDN: $servido"
          [ "$servido" = "$esperado" ] || echo "::warning::o CDN ainda serve $servido; o cache expira em até 5 min a partir do push"
      # Notificações só quando algo mudou (e foi publicado) ou a leitura falhou; sem mudança, silêncio.
      # E-mail e Telegram seguem a mesma regra e são independentes: a falha de um não cancela o outro.
      # Se a publicação falhou, ninguém é avisado de "atualizado": o próximo ciclo refaz a leitura e publica.
      - name: Enviar e-mail com o resumo
        if: ${{ !cancelled() && steps.sync.outputs.status != 'unchanged' && steps.publish.outcome != 'failure' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
        run: node scripts/send-email.mjs
      - name: Enviar Telegram com o resumo
        if: ${{ !cancelled() && steps.sync.outputs.status != 'unchanged' && steps.publish.outcome != 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/send-telegram.mjs
      - name: Falhar o job se a leitura falhou
        if: steps.sync.outcome == 'failure'
        run: exit 1
