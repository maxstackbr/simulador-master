    <script>
      // Tema claro por padrão; escolha salva em localStorage 'theme' (mesma chave do site Max Stack).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
